name: Windows signing smoke test
on:
  pull_request:
    paths:
      - 'scripts/sign_windows_artifacts.ps1'
      - 'scripts/setup_dev_signing.ps1'
      - '.github/workflows/signing-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development-signature:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary development certificate and verify Authenticode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject 'CN=FolderOrganizer CI Temporary Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2)
          $password = [guid]::NewGuid().ToString('N')
          $pfx = Join-Path $env:RUNNER_TEMP 'signing-smoke.pfx'
          $testExecutable = Join-Path $env:RUNNER_TEMP 'signing-smoke.exe'
          try {
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\whoami.exe') -Destination $testExecutable
            (Get-Item -LiteralPath $testExecutable).IsReadOnly = $false
            $env:WINDOWS_SIGNING_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
            $env:WINDOWS_SIGNING_PFX_PASSWORD = $password
            $env:WINDOWS_SIGNING_REQUIRED = 'true'
            $env:WINDOWS_SIGNING_TRUST_MODE = 'development'
            $env:WINDOWS_SIGNING_TIMESTAMP_URL = 'none'
            ./scripts/sign_windows_artifacts.ps1 -Files @($testExecutable)
            $signature = Get-AuthenticodeSignature -LiteralPath $testExecutable
            if ($null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw 'Signed EXE does not have the expected development certificate.'
            }
            Write-Host "Development Authenticode verified ($($signature.Status))."
          }
          finally {
            Remove-Item -LiteralPath $pfx, $testExecutable -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_PFX_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
