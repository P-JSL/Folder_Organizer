name: Python and Rust release builds
run-name: Python and Rust release · ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python build dependencies
        run: python -m pip install -e ".[dev,bundle]"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: windows-rust-static-1.99.1-${{ hashFiles('rust-app/Cargo.lock') }}
      - name: Build changed Python edition (previous suites skipped)
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FolderOrganizer --collect-data PySide6 --copy-metadata PySide6-Essentials --copy-metadata shiboken6 --copy-metadata Pillow --copy-metadata pypdf desktop_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FolderOrganizerUpdater updater_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item version.json dist/FolderOrganizer/
          Copy-Item dist/FolderOrganizerUpdater.exe dist/FolderOrganizer/
          Copy-Item README.md,CHANGELOG.md,docs/THIRD_PARTY.md dist/FolderOrganizer/
          Copy-Item -Recurse docs/licenses dist/FolderOrganizer/licenses
      - name: Build new native Rust programs
        run: cargo +1.99.1 build --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --release --features gui --bins
      - name: Package native Rust edition and dependency notices
        run: python scripts/package_rust.py --binaries rust-app/target/x86_64-pc-windows-msvc/release
      - name: Reuse passed Rust Windows checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/reuse_rust_windows_checks.py
      - name: Check only the remaining Windows recovery case
        run: python -m pytest -q tests/test_payload_metadata_windows_v1.py::test_native_stream_added_after_capture_is_kept_with_original_file
      - name: New two-edition package contract
        run: python scripts/windows_editions_v6.py
      - name: ZIP and checksum both editions
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FolderOrganizer -DestinationPath FolderOrganizer-Windows-x64.zip
          Compress-Archive -Path dist/FolderOrganizerRust -DestinationPath FolderOrganizer-Rust-Windows-x64.zip
          $packages = 'FolderOrganizer-Windows-x64.zip','FolderOrganizer-Rust-Windows-x64.zip'
          $packages | ForEach-Object {
            $digest = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$digest  $_"
          } | Set-Content -Encoding utf8 SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-Python-Windows-x64
          retention-days: 14
          compression-level: 0
          path: |
            FolderOrganizer-Windows-x64.zip
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-Rust-Windows-x64
          retention-days: 14
          compression-level: 0
          path: |
            FolderOrganizer-Rust-Windows-x64.zip
            SHA256SUMS.txt
      - name: Prepare separate assets in release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_dual_release.py
      - name: Preserve compiler cache for subsequent fixes
        if: always() && steps.rust_cache.outputs.cache-primary-key != '' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
