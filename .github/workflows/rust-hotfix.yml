name: Rust-only formal hotfix build
run-name: Rust v0.6.0 hotfix · ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native packaging inspector only
        run: python -m pip install pefile==2024.8.26
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: windows-rust-static-1.99.1-${{ hashFiles('rust-app/Cargo.lock', 'rust-app/Cargo.toml', '.cargo/config.toml') }}
      - name: Check only new native held-handle fallback case
        run: cargo +1.99.1 test --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --lib windows_identity_compat_fallback_uses_real_held_handle_after_path_replacement
      - name: Check only new native identity regression cases
        run: cargo +1.99.1 test --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --test windows_identity_compat_v6
      - name: Check only new Windows copy metadata regression cases
        run: cargo +1.99.1 test --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --test windows_copy_metadata_v6
      - name: Check only new late-stream move rollback case
        run: cargo +1.99.1 test --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --lib copy_metadata_v6
      - name: Build formal native Rust programs
        run: cargo +1.99.1 build --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --release --features gui --bins
      - name: Sign first-party Windows executables if configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_SIGNING_TRUST_MODE: ${{ vars.WINDOWS_SIGNING_TRUST_MODE }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          ./scripts/sign_windows_artifacts.ps1 -Files @(
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRust.exe',
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRustCLI.exe',
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRustUpdater.exe'
          )
      - name: Package Rust edition, source receipt, and native imports
        run: python scripts/windows_rust_hotfix_v6.py package
      - name: Verify changed packaged identity path and native startup
        run: python scripts/windows_rust_hotfix_v6.py verify
      - name: ZIP Rust edition and record checksum
        run: python scripts/windows_rust_hotfix_v6.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-Rust-Windows-x64-hotfix
          retention-days: 14
          compression-level: 0
          path: |
            FolderOrganizer-Rust-Windows-x64.zip
            SHA256SUMS-Rust.txt
            Rust-BUILD_INFO.json
            Rust-VERIFICATION.json
      - name: Preserve compiler cache for subsequent fixes
        if: always() && steps.rust_cache.outputs.cache-primary-key != '' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
