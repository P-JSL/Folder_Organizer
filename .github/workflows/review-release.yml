name: Report review and release
run-name: v0.7.0 changed paths · ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Reuse an exact passed build/native gate after the known final console encoding failure'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: inputs.reuse_run_id == ''
    name: New Windows paths
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: windows-rust-static-1.99.1-${{ hashFiles('rust-app/Cargo.lock', 'rust-app/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: windows-rust-static-1.99.1-
      - name: Check only new native Windows cases
        run: cargo +1.99.1 test --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --test windows_review_v070
  build:
    if: inputs.reuse_run_id == ''
    name: Build both editions
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[bundle]"
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: windows-rust-static-1.99.1-${{ hashFiles('rust-app/Cargo.lock', 'rust-app/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: windows-rust-static-1.99.1-
      - name: Build changed Widgets distribution
        run: python scripts/build_python_distribution.py
      - name: Build changed native Rust programs
        run: cargo +1.99.1 build --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --release --features gui --bins
      - name: Package native programs and notices
        run: python scripts/package_rust.py --binaries rust-app/target/x86_64-pc-windows-msvc/release
      - name: Apply configured executable signing before ZIP creation
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_SIGNING_TRUST_MODE: ${{ vars.WINDOWS_SIGNING_TRUST_MODE }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $targets = @(
            'dist/FolderOrganizer/FolderOrganizer.exe',
            'dist/FolderOrganizer/FolderOrganizerUpdater.exe',
            'dist/FolderOrganizerRust/FolderOrganizerRust.exe',
            'dist/FolderOrganizerRust/FolderOrganizerRustCLI.exe',
            'dist/FolderOrganizerRust/FolderOrganizerRustUpdater.exe'
          )
          ./scripts/sign_windows_artifacts.ps1 -Files $targets
          $configured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)
          $mode = if ($configured) { $env:WINDOWS_SIGNING_TRUST_MODE } else { 'unsigned' }
          if ($configured -and [string]::IsNullOrWhiteSpace($mode)) { $mode = 'development' }
          $signatures = @($targets | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_
            @{file=$_; status=[string]$signature.Status; certificate_present=($null -ne $signature.SignerCertificate)}
          })
          @{mode=$mode; public_trust_verified=($mode -eq 'public'); programs=$signatures} |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist/WINDOWS_SIGNING_STATUS.json
      - name: Archive exact release payloads
        run: python scripts/archive_review_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-v070-build
          retention-days: 14
          compression-level: 0
          path: release-build/*
      - name: Preserve compiler cache
        if: always() && steps.rust_cache.outputs.cache-primary-key != '' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
  reuse:
    name: Preserve passed build and checks
    if: inputs.reuse_run_id != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FolderOrganizer-v070-build
          path: release-build
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Verify unchanged compiled source and passed checks
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: python scripts/reuse_review_release.py --run-id "$REUSE_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-v070-build
          compression-level: 0
          path: release-build/*
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-v070-reused-results
          path: reuse-results/*
  review:
    name: New artifact checks
    needs: [build, reuse]
    if: always() && !cancelled() && (needs.build.result == 'success' || needs.reuse.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture image encoder
        if: inputs.reuse_run_id == ''
        run: python -m pip install Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          name: FolderOrganizer-v070-build
          path: release-build
      - name: Extract exact build artifacts
        run: python scripts/extract_review_release.py
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id != ''
        with:
          name: FolderOrganizer-v070-reused-results
          path: dist
      - name: Check changed Python packaging and visible Widgets
        if: inputs.reuse_run_id == ''
        run: python scripts/windows_python_bundle_v070.py
      - name: Check changed Rust GUI startup
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "rust-v070-local"
          $env:FOLDER_ORGANIZER_RUST_SMOKE = '1'
          $process = Start-Process -FilePath dist/FolderOrganizerRust/FolderOrganizerRust.exe -ArgumentList '--gui-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "New Rust GUI failed ($($process.ExitCode))" }
      - name: Compare changed exact analysis and common report with five alternating runs
        run: python scripts/benchmark_editions_v070.py --require-windows --python-command '["dist/FolderOrganizer/FolderOrganizer.exe", "--cli"]' --rust-command '["dist/FolderOrganizerRust/FolderOrganizerRustCLI.exe"]' --output dist/EDITIONS_BENCHMARK_0.7.0.json
      - name: Record changed-path results
        run: |
          New-Item -ItemType Directory review-results
          Copy-Item dist/PYTHON_PACKAGE_CHECK.json,dist/EDITIONS_BENCHMARK_0.7.0.json review-results/
          if (Test-Path dist/PYTHON_PACKAGE_GUI.png) { Copy-Item dist/PYTHON_PACKAGE_GUI.png review-results/ }
          if (Test-Path dist/PRIOR_PACKAGE_LOG.txt) { Copy-Item dist/PRIOR_PACKAGE_LOG.txt review-results/ }
          '{"native_gui_rendered":true,"version":"0.7.0","unchanged_feature_tests":"skipped"}' | Set-Content -Encoding utf8 review-results/RUST_GUI_CHECK.json
      - uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-v070-review
          retention-days: 14
          path: review-results/*
  publish:
    name: Publish reviewed release
    needs: [build, native, reuse, review]
    if: always() && !cancelled() && needs.review.result == 'success' && ((needs.build.result == 'success' && needs.native.result == 'success') || needs.reuse.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FolderOrganizer-v070-build
          path: release-build
      - uses: actions/download-artifact@v4
        with:
          name: FolderOrganizer-v070-review
          path: review-results
      - name: Publish both passed editions
        run: python scripts/publish_review_release.py
