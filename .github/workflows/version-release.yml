name: Python and Rust package release
run-name: Release ${{ github.ref_name }} · reuse passed checks
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Immutable version tag to package; leave empty when dispatching from the tag'
        required: false
        default: ''
      stage_only:
        description: 'Upload exact packages to a prepared draft; leave final publication to the release operator'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve verified repository bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bind retained Windows verification to the release source
        shell: pwsh
        run: |
          $record = Get-Content docs/WINDOWS_TRANSFER_METADATA_RESULTS.json -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath $record.source_file -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Verified source SHA256: $actual"
          if ($actual -cne $record.fixed_source_sha256) { throw 'Source differs from the verified Windows fix' }
          foreach ($batch in $record.windows_native.batches) {
            if ($batch.hashes.fixed -cne $actual -or $batch.cases.fixed.exit_code -ne 0) {
              throw 'Retained native Windows result is not a passing result for this exact source'
            }
          }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $source = (git rev-parse HEAD).Trim()
          $tagSource = (git rev-parse "v$version^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $tagSource) { throw 'Checkout must match the immutable version tag' }
          Write-Output "Exact build source: $source"
      - name: Install packaging dependencies only
        run: python -m pip install -e ".[bundle]"
      - name: Install pinned Rust compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        id: rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: windows-rust-static-1.99.1-${{ hashFiles('rust-app/Cargo.lock', 'rust-app/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: windows-rust-static-1.99.1-
      - name: Build Python edition with the new version
        run: python scripts/build_python_distribution.py
      - name: Build Rust edition with the new version
        run: cargo +1.99.1 build --manifest-path rust-app/Cargo.toml --locked --target x86_64-pc-windows-msvc --release --features gui --bins
      - name: Reuse existing dependency notices
        run: gh release download v0.6.0 --repo P-JSL/Folder_Organizer --pattern FolderOrganizer-Rust-Windows-x64.zip --dir reuse
      - name: Sign first-party Windows executables if configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          WINDOWS_SIGNING_TRUST_MODE: ${{ vars.WINDOWS_SIGNING_TRUST_MODE }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          ./scripts/sign_windows_artifacts.ps1 -Files @(
            'dist/FolderOrganizer/FolderOrganizer.exe',
            'dist/FolderOrganizer/FolderOrganizerUpdater.exe',
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRust.exe',
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRustCLI.exe',
            'rust-app/target/x86_64-pc-windows-msvc/release/FolderOrganizerRustUpdater.exe'
          )
      - name: Package both editions and generate release checksums
        run: python scripts/package_version_release.py
      - name: Preserve exact package source receipt
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $packages = @('FolderOrganizer-Windows-x64.zip', 'FolderOrganizer-Rust-Windows-x64.zip', 'SHA256SUMS.txt') | ForEach-Object {
            @{name=$_; bytes=(Get-Item -LiteralPath $_).Length; sha256=(Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          @{version=$version; source_commit=$source; workflow_source=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID; packages=@($packages)} |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 RELEASE_BUILD_INFO.json
      - name: Preserve built packages before any release API call
        uses: actions/upload-artifact@v4
        with:
          name: FolderOrganizer-release-packages
          retention-days: 14
          compression-level: 0
          path: |
            FolderOrganizer-Windows-x64.zip
            FolderOrganizer-Rust-Windows-x64.zip
            SHA256SUMS.txt
            RELEASE_BUILD_INFO.json
      - name: Stage or publish exact packages without replacing existing assets
        env:
          STAGE_ONLY: ${{ inputs.stage_only }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $source = (git rev-parse HEAD).Trim()
          $existing = gh release view $tag --repo P-JSL/Folder_Organizer --json isDraft,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo P-JSL/Folder_Organizer --draft --verify-tag --target $source --title "Folder Organizer $tag · Python / Rust" --notes-file "docs/RELEASE_NOTES_$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $existing = gh release view $tag --repo P-JSL/Folder_Organizer --json isDraft,targetCommitish,assets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $draft = $existing | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.targetCommitish -cne $source -or $draft.assets.Count -ne 0) {
            throw 'Expected an empty draft for the exact immutable source; refusing asset replacement'
          }
          gh release upload $tag FolderOrganizer-Windows-x64.zip FolderOrganizer-Rust-Windows-x64.zip SHA256SUMS.txt --repo P-JSL/Folder_Organizer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:STAGE_ONLY -ne 'true') {
            gh release edit $tag --repo P-JSL/Folder_Organizer --draft=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve compiler cache
        if: always() && steps.rust_cache.outputs.cache-primary-key != '' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}
